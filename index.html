<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f45b18"><link rel="manifest" href="manifest.webmanifest"><title>Genki N5 Kanji — Text + Book View</title>
<style>
:root{--o:#f45b18;--bg:#fff8f3;--ink:#24201d;--muted:#766d67;--card:#fff;--line:#eadfd8;--tan:#f4dfc9;--ok:#208b57;--bad:#c53b3b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;background:rgba(255,248,243,.97);backdrop-filter:blur(12px);z-index:5;padding:13px 16px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{border:0;background:white;padding:8px 2px 11px;color:var(--muted);font-size:11px}.nav button.active{color:var(--o);font-weight:800}.nav b{display:block;font-size:18px}.page{padding:17px 14px}.hero{background:var(--o);color:white;border-radius:22px;padding:20px;margin-bottom:14px}.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;opacity:.92}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.stat strong{font-size:25px;display:block}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:13px;padding:10px 13px;font-weight:700}.btn.primary{background:var(--o);color:#fff;border-color:var(--o)}.btn.ok{background:#e8f6ef;color:var(--ok)}.btn.bad{background:#fdecec;color:var(--bad)}.btn.active{background:#f7e1d3;border-color:#e7b99b;color:#8c3d16}.study{text-align:center}.kanji{font-size:105px;line-height:1;margin:10px 0 4px;font-family:"Noto Serif JP","Yu Mincho",serif}.meaning{font-size:21px;font-weight:800}.reading{font-size:18px;margin-top:5px}.details{text-align:left;margin-top:12px}.details div{padding:8px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;font-size:11px;background:#f3e9e3;padding:4px 8px;border-radius:99px}.progress{height:8px;background:#eee0d8;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--o)}.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.row .k{font-size:34px;width:48px;text-align:center;font-family:"Noto Serif JP","Yu Mincho",serif}.row .m{flex:1}.search,.select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;margin:8px 0}.hide{display:none!important}.source{font-size:11px;color:var(--muted);margin-top:12px}.bookbox{margin:15px -2px 0;background:#faf7f4;border:1px solid var(--line);border-radius:15px;padding:8px}.bookbox img{display:block;width:100%;height:auto;border-radius:10px;background:#fff}.booklabel{text-align:left;font-size:11px;color:var(--muted);margin:5px 3px}.exercise{margin-top:12px}.exercise img{width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:12px}.exerciseHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.done{font-size:11px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#24201d;color:#fff;padding:10px 14px;border-radius:12px;z-index:30;display:none}.note{background:#fff3e9;border:1px solid #f0d3bc;border-radius:14px;padding:11px 12px;font-size:13px}.sectionTitle{margin:18px 0 8px}.lessonTabs{display:flex;gap:7px;overflow:auto;padding:2px 0 7px}.lessonTabs button{white-space:nowrap}.zoom{cursor:zoom-in}.fullscreen{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.fullscreen img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:12px;top:12px;border:0;background:white;border-radius:50%;width:42px;height:42px;font-size:20px}@media(min-width:600px){.page{padding:23px}.kanji{font-size:145px}}
</style></head><body><div class="app"><header class="top"><h1>Genki N5 Kanji — Text + Book View</h1><div class="sub">145 kanji · Lessons 3–12 · highlights + examples + chapter exercises</div></header><main id="app"></main><nav class="nav"><button data-page="home"><b>⌂</b>Home</button><button data-page="learn"><b>学</b>Text Study</button><button data-page="book"><b>本</b>Book View</button><button data-page="exercises"><b>✎</b>Exercises</button><button data-page="review"><b>↻</b>Review</button><button data-page="all"><b>漢</b>All</button></nav></div><div id="toast" class="toast"></div><script>
let D=[],L={},S=JSON.parse(localStorage.getItem('gk5book')||'{}'),page='home',idx=0,shown=false,lesson=3;
const $=x=>document.querySelector(x),save=()=>localStorage.setItem('gk5book',JSON.stringify(S)),rateOf=id=>S[id]?.r||0;
Promise.all([fetch('kanji.json').then(r=>r.json()),fetch('lessons.json').then(r=>r.json())]).then(([d,l])=>{D=d;L=l;render()});
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1400)}
function nav(p){page=p;shown=false;render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)nav(b.dataset.page);let z=e.target.closest('.zoom');if(z)zoom(z.src);let c=e.target.closest('[data-close]');if(c)document.querySelector('.fullscreen')?.remove()});
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let el=$('#app');if(page==='home')el.innerHTML=home();else if(page==='learn')el.innerHTML=learn();else if(page==='book')el.innerHTML=bookView();else if(page==='exercises')el.innerHTML=exercises();else if(page==='review')el.innerHTML=review();else el.innerHTML=all();}
function stats(){let a=D.filter(x=>rateOf(x.id)>0).length;return[a,D.length,a/D.length*100]}
function home(){let[a,n,p]=stats();return `<div class="page"><section class="hero"><h2>Study Genki the way the book is laid out.</h2><p>Keep the highlighted vocabulary, normal examples, readings, and the original chapter exercises together.</p></section><div class="grid"><div class="stat"><strong>${n}</strong><span class="muted">Kanji</span></div><div class="stat"><strong>${a}</strong><span class="muted">Reviewed</span></div></div><div class="card" style="margin-top:10px"><b>Overall progress</b><div class="progress" style="margin:9px 0 5px"><i style="width:${p}%"></i></div><span class="muted">${Math.round(p)}%</span></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="nav('learn')">Text Study</button><button class="btn" onclick="nav('book')">Book View</button><button class="btn" onclick="nav('exercises')">Chapter Exercises</button></div><div class="card" style="margin-top:12px"><b>Lessons</b><div class="list">${Object.keys(L).map(l=>`<div class="row" onclick="goLesson(${l})"><div class="m"><b>Lesson ${l}</b><br><span class="muted">${D.filter(x=>x.lesson==l).length} kanji · ${L[l].exercisePages.length} exercise pages</span></div><span class="pill">Open</span></div>`).join('')}</div></div></div>`}
function goLesson(l){lesson=Number(l);idx=D.findIndex(x=>x.lesson===lesson);if(idx<0)idx=0;nav('learn')}
function learn(){let d=D[idx];return `<div class="page"><div class="actions"><button class="btn" onclick="prev()">←</button><span style="padding:10px 3px" class="muted">${idx+1} / ${D.length}</span><button class="btn" onclick="next()">→</button><button class="btn" onclick="goLesson(${d.lesson})">L${d.lesson}</button><button class="btn" onclick="nav('book')">Book View</button></div><section class="card study"><div><span class="pill">Lesson ${d.lesson}</span> <span class="pill">${rateOf(d.id)?'Reviewed':'New'}</span></div><div class="kanji">${d.kanji}</div>${shown?`<div class="meaning">${d.meaning}</div><div class="reading">${d.reading}</div><div class="details"><div><b>Kun-yomi:</b> ${d.kun||'—'}</div><div><b>On-yomi:</b> ${d.on||'—'}</div></div><div class="note" style="margin-top:12px;text-align:left"><b>Source-based study data</b><br>This is the JSON/text study view. Use <b>Book View</b> for the original Genki formatting, including highlighted and non-highlighted vocabulary/examples.</div><div class="actions" style="justify-content:center;margin-top:12px"><button class="btn bad" onclick="rate(1)">Hard</button><button class="btn" onclick="rate(2)">Good</button><button class="btn ok" onclick="rate(3)">Easy</button></div>`:`<p class="muted">Reveal the JSON/source-based details.</p><button class="btn primary" onclick="shown=true;render()">Reveal</button>`}<div class="source">Genki source: Lesson ${d.lesson}, scanned page ${d.sourcePage}, row ${d.sourceRow}</div></section></div>`}
function bookView(){let d=D[idx];return `<div class="page"><div class="actions"><button class="btn" onclick="prev()">←</button><span style="padding:10px 3px" class="muted">${idx+1} / ${D.length}</span><button class="btn" onclick="next()">→</button><button class="btn" onclick="nav('learn')">Text Study</button><button class="btn" onclick="goLesson(${d.lesson})">L${d.lesson}</button></div><section class="card"><div><span class="pill">Lesson ${d.lesson}</span> <span class="pill">${d.kanji}</span></div><h2 style="margin-bottom:4px">Genki Book View</h2><p class="muted">Original scanned row — highlighted and non-highlighted text, readings, and examples are preserved.</p><div class="bookbox"><img class="zoom" src="${d.bookImage}" alt="Original Genki Lesson ${d.lesson} row for ${d.kanji}"><div class="booklabel">Lesson ${d.lesson} · source page ${d.sourcePage} · row ${d.sourceRow}</div></div></section></div>`}
function prev(){idx=(idx-1+D.length)%D.length;shown=false;render()}function next(){idx=(idx+1)%D.length;shown=false;render()}function rate(v){S[D[idx].id]={r:v,t:Date.now()};save();toast(v===1?'Marked Hard':v===2?'Marked Good':'Marked Easy');next()}
function lessonTabs(current,fn){return `<div class="lessonTabs">${Object.keys(L).map(l=>`<button class="btn ${Number(l)===current?'active':''}" onclick="${fn}(${l})">L${l}</button>`).join('')}</div>`}
function exercises(){let l=lesson;return `<div class="page"><section class="hero"><h2>Chapter Exercises</h2><p>Original Genki exercise pages for each kanji lesson.</p></section>${lessonTabs(l,'setExerciseLesson')}<div class="note">These pages are kept as the original book pages so the instructions, examples, highlighting, blanks, and illustrations stay intact.</div><div class="exercise">${L[l].exercisePages.map((src,i)=>`<section class="card" style="margin-top:12px"><div class="exerciseHead"><b>Lesson ${l} · Exercise page ${i+1}</b><label class="done"><input type="checkbox" ${S['ex'+l+'-'+i]?'checked':''} onchange="markEx('${l}-${i}',this.checked)"> Done</label></div><img class="zoom" src="${src}" alt="Genki Lesson ${l} exercise page ${i+1}"></section>`).join('')}</div></div>`}
function setExerciseLesson(l){lesson=Number(l);render()}
function markEx(id,v){if(v)S['ex'+id]=1;else delete S['ex'+id];save();toast(v?'Exercise marked done':'Exercise unchecked')}
function review(){let hard=D.filter(x=>rateOf(x.id)===1);return `<div class="page"><section class="hero"><h2>Review</h2><p>${hard.length} hard card${hard.length===1?'':'s'} to revisit.</p></section>${hard.length?`<div class="list">${hard.map(x=>`<div class="row" onclick="jump(${x.id})"><div class="k">${x.kanji}</div><div class="m"><b>${x.meaning}</b><br><span class="muted">${x.reading}</span></div><span class="pill">L${x.lesson}</span></div>`).join('')}</div>`:`<div class="card"><p class="muted">No Hard cards yet. Mark cards Hard during Learn and they will appear here.</p><button class="btn primary" onclick="nav('learn')">Learn now</button></div>`}</div>`}
function jump(id){idx=D.findIndex(x=>x.id===id);shown=false;nav('learn')}
function all(){let filterLesson=lesson;return `<div class="page"><h2>All Kanji</h2><div class="lessonTabs"><button class="btn ${lesson===0?'active':''}" onclick="setAllLesson(0)">All</button>${Object.keys(L).map(l=>`<button class="btn ${Number(l)===lesson?'active':''}" onclick="setAllLesson(${l})">L${l}</button>`).join('')}</div><input class="search" id="q" placeholder="Search kanji, meaning, or reading…" oninput="filterAll()"><div id="alist" class="list">${D.map(x=>`<div class="row ${lesson!==0&&x.lesson!==lesson?'hide':''}" data-id="${x.id}" data-search="${(x.kanji+' '+x.meaning+' '+x.reading).toLowerCase()}" onclick="jump(${x.id})"><div class="k">${x.kanji}</div><div class="m"><b>${x.meaning}</b><br><span class="muted">${x.reading}</span></div><span class="pill">L${x.lesson}</span></div>`).join('')}</div></div>`}
function setAllLesson(l){lesson=Number(l);render();}
function filterAll(){let q=$('#q').value.toLowerCase();document.querySelectorAll('#alist .row').forEach(r=>{let id=Number(r.dataset.id),d=D.find(x=>x.id===id);r.classList.toggle('hide',!(r.dataset.search.includes(q)&&(lesson===0||d.lesson===lesson)))} )}
function zoom(src){let d=document.createElement('div');d.className='fullscreen';d.innerHTML=`<button class="close" data-close>×</button><img src="${src}">`;document.body.appendChild(d)}
function resetProgress(){if(confirm('Reset all local study and exercise progress?')){S={};save();render();toast('Progress reset')}}
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=5').then(r=>r.update()).catch(()=>{});</script></body></html>
